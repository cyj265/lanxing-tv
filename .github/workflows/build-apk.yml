name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 固定 debug 签名：优先级 仓库内 b64 文件 > actions 缓存 > 首次生成。
      # 仓库内 .github/debug-keystore.b64 一旦存在且有效，签名永久不变，新版本必然可覆盖安装。
      - name: Cache Android debug keystore
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: android-debug-keystore-v1

      - name: Restore or generate debug keystore
        id: keystore-setup
        run: |
          mkdir -p ~/.android
          if [ -f .github/debug-keystore.b64 ]; then
            base64 -d .github/debug-keystore.b64 > ~/.android/debug.keystore
            if keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1; then
              echo "source=repo-file"
            else
              echo "repo keystore invalid, regenerating"
              keytool -genkeypair -v -keystore ~/.android/debug.keystore \
                -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass android -keypass android \
                -dname "CN=Android Debug,O=Android,C=US"
              echo "source=repo-file-invalid-regenerated"
            fi
          elif [ -f ~/.android/debug.keystore ]; then
            echo "source=cache"
          else
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "source=generated"
          fi

      - name: Export debug keystore as base64 asset
        run: |
          base64 -w0 ~/.android/debug.keystore > debug-keystore.b64

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 位图图标以 base64 文本形式入库（推送通道无法直接传二进制），构建前解码还原为 PNG
      - name: Decode base64 assets
        run: |
          find app/src/main/res -name '*.b64' | while read f; do
            base64 -d "$f" > "${f%.b64}"
            rm -f "$f"
          done

      - name: Build release APK
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set +e
          gradle assembleRelease --no-daemon 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "BUILD_EXIT=$status" >> $GITHUB_ENV
          exit 0

      - name: Publish build log on failure
        if: env.BUILD_EXIT != '0'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          cp build.log build-errors.txt
          git add build-errors.txt
          git commit -m "chore: publish build errors" || true
          git push origin HEAD:main || true

      - name: Fail job on build error
        if: env.BUILD_EXIT != '0'
        run: exit 1

      - name: Rename APK with version
        run: |
          mkdir -p dist
          echo "=== Finding APK files ==="
          find app/build -name "*.apk" -type f 2>/dev/null || echo "No APK found"
          echo "=== Listing release output dir ==="
          ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "release dir not found"
          echo "=== Copying APK ==="
          cp app/build/outputs/apk/release/app-release.apk dist/iptv-player-v${{ github.run_number }}.apk
          echo "=== Listing dist ==="
          ls -la dist/
          echo "APK ready: iptv-player-v${{ github.run_number }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iptv-player-apk
          path: dist/*.apk
          retention-days: 30

      - name: Auto tag release version
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          TAG="v$(grep versionName app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "TAG=$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          git tag "$TAG" 2>/dev/null || true
          git push origin "$TAG" 2>/dev/null || true
          echo "Tag pushed: $TAG"

      - name: Verify dist before publish
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        run: |
          echo "=== TAG = ${{ env.TAG }} ==="
          echo "=== dist contents ==="
          ls -la dist/
          echo "=== debug-keystore.b64 ==="
          ls -la debug-keystore.b64 2>/dev/null || echo "keystore b64 not found"

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            dist/*.apk
            debug-keystore.b64
          fail_on_unmatched_files: true
          generate_release_notes: true

      # 清理 Release 旧资产：只保留本次构建的 APK 与 keystore b64，避免资产越堆越多
      - name: Clean old release assets
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.TAG }}
        run: |
          CUR="iptv-player-v${{ github.run_number }}.apk"
          echo "Cleaning assets for tag: $RELEASE_TAG, keeping: $CUR"
          gh release view "$RELEASE_TAG" --json assets -q '.assets[].name' || echo "No assets found"
          for asset in $(gh release view "$RELEASE_TAG" --json assets -q '.assets[].name' 2>/dev/null); do
            if [ "$asset" != "$CUR" ] && [[ "$asset" != *.b64 ]]; then
              echo "Deleting old asset: $asset"
              gh release delete-asset "$RELEASE_TAG" "$asset" --yes || true
            fi
          done

      # 清理 Release 列表：只保留最近 3 个（含本次），更早的 Release 与 tag 一并删除
      - name: Keep only latest 3 releases
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYEOF'
          import subprocess, urllib.parse

          repo = "${{ github.repository }}"

          def gh(*args):
              r = subprocess.run(["gh", "api", *args], capture_output=True, text=True)
              return r.stdout

          out = gh(f"repos/{repo}/releases", "--paginate", "-q",
                   ".[] | [.created_at, .id, .tag_name] | @tsv")
          rows = [ln.split("\t") for ln in out.strip().splitlines() if ln.strip()]
          rows.sort(reverse=True)  # created_at 为 ISO8601，字符串可直接排序
          deleted = 0
          for idx, (created, rid, tag) in enumerate(rows):
              if idx < 3:
                  continue
              print(f"deleting release {tag} id={rid}")
              gh("-X", "DELETE", f"repos/{repo}/releases/{rid}")
              safe = urllib.parse.quote(tag, safe="")
              gh("-X", "DELETE", f"repos/{repo}/git/refs/tags/{safe}")
              deleted += 1
          print(f"done, deleted={deleted}")
          PYEOF
