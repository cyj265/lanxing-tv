name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 位图图标以 base64 文本形式入库（推送通道无法直接传二进制），构建前解码还原为 PNG
      - name: Decode base64 assets
        run: |
          find app/src/main/res -name '*.b64' | while read f; do
            base64 -d "$f" > "${f%.b64}"
            rm -f "$f"
          done

      # release 自签证书：从 Secrets 解码为 PKCS#12 文件，避免 debug 证书被 Google Play Protect 拦截。
      - name: Setup release keystore
        id: release-keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > $HOME/release.keystore
            echo "status=ready"
            echo "KEYSTORE_PATH=$HOME/release.keystore" >> $GITHUB_ENV
            ls -la $HOME/release.keystore
            keytool -list -keystore $HOME/release.keystore -storepass "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" -storetype PKCS12 2>&1 | head -5
          else
            echo "status=skipped (RELEASE_KEYSTORE_BASE64 not set)"
          fi

      - name: Build release APK
        env:
          RUN_NUMBER: ${{ github.run_number }}
          BUGLY_APP_ID: ${{ secrets.BUGLY_APP_ID }}
          SIGNING_STORE_FILE: ${{ env.KEYSTORE_PATH }}
          SIGNING_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "SIGNING_STORE_FILE=$SIGNING_STORE_FILE"
          ls -la "$SIGNING_STORE_FILE" 2>&1 || echo "keystore file not found!"
          set +e
          gradle assembleRelease --no-daemon 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "BUILD_EXIT=$status" >> $GITHUB_ENV
          exit 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
          if-no-files-found: warn

      - name: Publish build log on failure
        if: env.BUILD_EXIT != '0'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          cp build.log build-errors.txt || true
          git add build-errors.txt 2>/dev/null || true
          git commit -m "chore: publish build errors [skip ci]" 2>/dev/null || true
          git push origin HEAD:main 2>/dev/null || true

      - name: Fail job on build error
        if: env.BUILD_EXIT != '0'
        run: exit 1

      - name: Rename APK with version
        run: |
          mkdir -p dist
          echo "=== Finding APK files ==="
          find app/build -name "*.apk" -type f 2>/dev/null || echo "No APK found"
          echo "=== Listing release output dir ==="
          ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "release dir not found"
          echo "=== Copying APK ==="
          cp app/build/outputs/apk/release/app-release.apk dist/iptv-player-v${{ github.run_number }}.apk
          echo "=== Listing dist ==="
          ls -la dist/
          echo "APK ready: iptv-player-v${{ github.run_number }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iptv-player-apk
          path: dist/*.apk
          retention-days: 30

      - name: Auto tag release version
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          TAG="v$(grep versionName app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "TAG=$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          git tag "$TAG" 2>/dev/null || true
          git push origin "$TAG" 2>/dev/null || true
          echo "Tag pushed: $TAG"

      - name: Verify dist before publish
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        run: |
          echo "=== TAG = ${{ env.TAG }} ==="
          echo "=== dist contents ==="
          ls -la dist/

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            dist/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true

      # 清理 Release 旧资产：只保留本次构建的 APK，避免资产越堆越多
      - name: Clean old release assets
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.TAG }}
        run: |
          CUR="iptv-player-v${{ github.run_number }}.apk"
          echo "Cleaning assets for tag: $RELEASE_TAG, keeping: $CUR"
          gh release view "$RELEASE_TAG" --json assets -q '.assets[].name' || echo "No assets found"
          for asset in $(gh release view "$RELEASE_TAG" --json assets -q '.assets[].name' 2>/dev/null); do
            if [ "$asset" != "$CUR" ]; then
              echo "Deleting old asset: $asset"
              gh release delete-asset "$RELEASE_TAG" "$asset" --yes || true
            fi
          done

      # 清理 Release 列表：只保留最近 3 个（含本次），更早的 Release 与 tag 一并删除
      - name: Keep only latest 3 releases
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYEOF'
          import subprocess, urllib.parse

          repo = "${{ github.repository }}"

          def gh(*args):
              r = subprocess.run(["gh", "api", *args], capture_output=True, text=True)
              return r.stdout

          out = gh(f"repos/{repo}/releases", "--paginate", "-q",
                   ".[] | [.created_at, .id, .tag_name] | @tsv")
          rows = [ln.split("\t") for ln in out.strip().splitlines() if ln.strip()]
          rows.sort(reverse=True)  # created_at 为 ISO8601，字符串可直接排序
          deleted = 0
          for idx, (created, rid, tag) in enumerate(rows):
              if idx < 3:
                  continue
              print(f"deleting release {tag} id={rid}")
              gh("-X", "DELETE", f"repos/{repo}/releases/{rid}")
              safe = urllib.parse.quote(tag, safe="")
              gh("-X", "DELETE", f"repos/{repo}/git/refs/tags/{safe}")
              deleted += 1
          print(f"done, deleted={deleted}")
          PYEOF
